name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.3.0 or v0.3.0-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify identity, download and publish the reviewed release archive
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_USE_RELEASE_TAG: ${{ inputs.tag }}
